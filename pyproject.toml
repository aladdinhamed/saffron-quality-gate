[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saffron-quality-gate"
version = "1.0.0"
description = "The world's first executable AI-quality gate. Scans code, content, config, and design against 36 anti-slop patterns (A-001 through A-036) and 14 quality dimensions — the same standard that powers the Saffron Empire."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary — Saffron AI Group"}
keywords = ["quality", "anti-slop", "code-review", "ai-quality", "gate", "saffron"]
authors = [
    {name = "Saffron AI Group", email = "sqg@saffronautomations.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://saffronautomations.com/saffron-quality-gate"
Documentation = "https://saffronautomations.com/saffron-quality-gate/docs"
Source = "https://github.com/aladdinhamed/saffron-quality-gate"
Changelog = "https://saffronautomations.com/saffron-quality-gate/changelog"

[project.scripts]
sqg = "sqg.cli:main"
saffron-quality-gate = "sqg.cli:main"

[tool.setuptools.packages.find]
include = ["sqg*"]

[tool.setuptools.package-data]
sqg = ["py.typed"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
all = ["ruff", "mypy", "bandit", "semgrep", "mutmut"]